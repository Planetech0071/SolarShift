[project]
name = "solarshift"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "python-multipart==0.0.32",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pvlib==0.16.1",
  "shapely==2.1.2",
  "opencv-python-headless==4.11.0.86",
  "Pillow==11.1.0",
  "torch @ https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
  "torchvision @ https://download.pytorch.org/whl/cpu/torchvision-0.20.1%2Bcpu-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
  "torch==2.5.1 ; sys_platform != 'linux'",
  "torchvision==0.20.1 ; sys_platform != 'linux'",
  "transformers==5.9.0",
  "safetensors==0.7.0",
  "httpx==0.28.1",
  "tzdata==2026.2",
  "pydantic==2.13.0",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "python -m scripts.prepare_vercel"

[tool.vercel.fastapi.static]
cdn = true
